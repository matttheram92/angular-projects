<div
  class="flex relative items-center rounded-full bg-white pl-3 outline outline-1 -outline-offset-1 outline-gray-300 focus-within:outline focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-primary"
>
  <span *ngIf="icon" class="absolute inset-y-0 right-4 flex items-center pl-2">
    <app-icon [icon]="icon"></app-icon>
  </span>
  <input
    type="text"
    [name]="label"
    [id]="label"
    class="block h-12 sm:h-min w-full grow py-1.5 pl-1 pr-3 rounded-full text-base text-black placeholder:text-gray-300 focus:outline focus:outline-0 sm:text-sm/6"
    [placeholder]="label"
  />
</div>
