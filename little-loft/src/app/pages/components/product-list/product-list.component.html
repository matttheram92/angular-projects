<div class="mx-auto max-w-2xl px-4 pt-4 pb-32 sm:px-6 lg:max-w-7xl lg:px-8">
  <div class="mx-auto flex items-center justify-between py-6">
    <h2 class="text-3xl flex-col font-bold">Soft Toys</h2>
    <a class="cursor-pointer align-right flex-col uppercase font-bold"
      >Filter</a
    >
  </div>

  <div
    class="grid grid-cols-3 gap-x-6 gap-y-10 lg:grid-cols-4 xl:grid-cols-6 xl:gap-x-8"
  >
    <a href="products" class="group" *ngFor="let product of products">
      <img
        [src]="product.src"
        [alt]="product.alt"
        class="aspect-square w-full rounded-lg bg-gray-200 object-cover group-hover:opacity-75 xl:aspect-[7/8]"
      />

      <h3 class="mt-4 text-lg font-medium text-gray-900">
        {{ product.title }}
      </h3>
      <p class="mt-1 text-sm text-gray-700">{{ product.price }}</p>
    </a>
  </div>
</div>
