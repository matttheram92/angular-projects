<div class="mx-auto max-w-2xl px-10 pb-32 md:px-6 lg:max-w-7xl lg:px-8">
  <div class="mx-auto flex justify-between pb-6">
    <h2 class="text-2xl font-bold">Soft Toys</h2>
    <app-button type="text-icon-left" text="FILTER" icon="filter"></app-button>
  </div>

  <div
    class="grid gap-x-2.5 gap-y-6 grid-cols-2 sm:grid-cols-3 sm:gap-x-3 md:grid-cols-4 lg:grid-cols-6 lg:gap-x-4 xl:grid-cols-6"
  >
    <a
      (click)="navigateToRoute('product/' + product.id)"
      class="group cursor-pointer"
      *ngFor="let product of products"
    >
      <img
        [src]="product.src"
        [alt]="product.alt"
        class="aspect-square w-full rounded-lg bg-gray-200 object-cover group-hover:opacity-75 xl:aspect-[7/8]"
      />

      <h3
        class="mt-4 text-lg font-medium line-clamp-3 leading-tight text-gray-900"
      >
        {{ product.title }}
      </h3>
      <p class="mt-1 text-sm text-gray-700">{{ product.price }}</p>
    </a>
  </div>
</div>
