<div class="relative isolate mx-auto max-w-2xl lg:max-w-7xl">
  <div class="flex flex-col h-screen">
    <div class="sm:hidden flex lg:flex-1 p-8 mx-auto">
      <img
        class="h-8 w-auto"
        src="../assets/little-loft.png"
        alt="Little Loft Logo"
      />
    </div>

    <app-splash-screen
      *ngIf="isMobile; else onboardingHero"
      class="h-4/6 sm:h-screen w-screen justify-center mb-auto flex flex-col sm:block sm:h-auto sm:w-auto"
      [splashScreenInfo]="splashScreenInfo"
    ></app-splash-screen>

    <ng-template #onboardingHero>
      <app-hero-section-with-cards
        [splashScreenInfo]="splashScreenInfo"
      ></app-hero-section-with-cards>
    </ng-template>
  </div>
</div>
