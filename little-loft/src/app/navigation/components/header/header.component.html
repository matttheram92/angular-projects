<header
  [class.hidden]="!showHeader"
  class="fixed z-10 sm:unset bg-lemon w-full sm:inline"
>
  <a
    [href]="skipLinkHref"
    class="skip-nav focus:block absolute top-0 left-0 bg-blue-600 text-white p-2 rounded"
  >
    Skip to main content
  </a>

  <nav
    class="mx-auto flex max-w-7xl items-center justify-between p-6 lg:px-8"
    aria-label="Global"
  >
    <div class="flex lg:flex-1">
      <a
        href="#"
        class="-m-1.5 p-1.5"
        [class.hidden]="!isHome"
        class="h-8 w-auto sm:inline"
      >
        <span class="sr-only">Little Loft</span>
        <img src="../assets/little-loft.png" alt="Little Loft Logo" />
      </a>
      <app-button
        type="text-icon-left"
        icon="leftArrow"
        text="BACK"
        (click)="navigateToRoute('home')"
        [class.hidden]="isHome"
        class="inline sm:hidden"
      ></app-button>
    </div>

    <div class="hidden lg:flex lg:gap-x-12">
      <div class="relative">
        <app-button
          id="btnSearch"
          type="text-icon-right"
          icon="search"
          text="Search"
          (click)="toggleSearchMenu()"
          class="flex"
        ></app-button>

        <app-search-section *ngIf="showSearchSubMenu"></app-search-section>
      </div>

      <app-button
        id="btnExplore"
        type="text"
        text="Explore"
        (click)="navigateToRoute('explore')"
        class="flex"
      ></app-button>

      <app-button
        id="btnSell"
        type="text"
        text="Sell"
        (click)="navigateToRoute('sell')"
        class="flex"
      ></app-button>

      <app-button
        id="btnInbox"
        type="text"
        text="Inbox"
        (click)="navigateToRoute('inbox')"
        class="flex"
      ></app-button>
    </div>

    <div class="flex flex-1 justify-end">
      <app-button
        *ngIf="!loggedIn"
        id="btnLogIn"
        type="text"
        text="Log in"
        (click)="navigateToRoute('login')"
        class="hidden lg:flex my-auto"
      ></app-button>

      <app-button
        *ngIf="loggedIn"
        id="btnProfile"
        type="text"
        text="Profile"
        (click)="navigateToRoute('profile')"
        class="hidden lg:flex my-auto"
      ></app-button>

      <app-button
        type="icon"
        icon="heart"
        text="Favourites"
        (click)="navigateToRoute('favourites')"
        class="my-auto"
      ></app-button>

      <app-button
        type="icon"
        icon="cart"
        text="Shopping basket"
        (click)="navigateToRoute('basket')"
        class="my-auto"
      ></app-button>

      <app-button
        type="icon"
        icon="burgerMenu"
        text="Open main menu"
        (click)="showSideMenu = true"
        class="my-auto hidden sm:inline-flex lg:hidden"
      ></app-button>
    </div>
  </nav>

  <div *ngIf="showSideMenu" class="lg:hidden" role="dialog" aria-modal="true">
    <app-side-menu
      [loggedIn]="loggedIn"
      (closeMenu)="showSideMenu = false"
    ></app-side-menu>
  </div>
</header>
