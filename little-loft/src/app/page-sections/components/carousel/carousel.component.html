<div
  *ngIf="!!carouselData"
  id="carousel"
  class="relative padding-between-components lg:mx-8"
>
  <div class="flex px-10 lg:px-2">
    <app-heading3>{{ carouselData.title }}</app-heading3>
    <app-button
      id="btn-all"
      class="-mt-3 ml-auto text-gray-400"
      [appNavigateTo]="carouselData.href"
      text="All"
      appendIcon="rightArrow"
      textColor="gray-400"
    ></app-button>
  </div>
  <div class="flex overflow-x-auto">
    <div class="flex h-full m-auto" [ngClass]="hiddenSideScrollClasses">
      <app-button
        id="btn-scroll-left"
        (click)="scrollLeft()"
        fillColor="lemon"
        icon="leftArrow"
      ></app-button>
    </div>
    <div #carouselContainer class="overflow-x-auto w-full mx-auto">
      <div
        class="grid px-10 lg:px-2 py-2 w-max overflow-y-hidden mx-auto"
        [ngClass]="getCarouselTypeStyles()"
      >
        <a
          *ngFor="let card of carouselData.cards"
          [appNavigateTo]="card.link"
          [attr.aria-label]="card.title"
          tabindex="0"
          class="flex-none w-full rounded snap-center cursor-pointer transition ease-in-out delay-150 hover:translate-y-0 hover:scale-105 duration-300"
        >
          <div
            *ngIf="carouselData.type === carouselTypeButtons"
            class="bg-black text-white text-center p-2"
          >
            <p class="w-full">{{ card.title }}</p>
          </div>

          <div
            *ngIf="carouselData.type === carouselTypeTextAndCircleImage"
            class="min-w-16 max-w-16"
          >
            <app-image-circle-card [item]="card"></app-image-circle-card>
          </div>

          <div
            *ngIf="carouselData.type === carouselTypeInImage"
            class="relative max-w-72 sm:max-w-full"
          >
            <app-image-card [item]="card" [inImage]="true"></app-image-card>
          </div>

          <div
            *ngIf="carouselData.type === carouselTypeSingleRow"
            class="overflow-hidden"
          >
            <app-image-card [item]="card"></app-image-card>
          </div>

          <div
            *ngIf="carouselData.type === carouselTypeTwoRows"
            class="overflow-hidden w-40 md:w-auto"
          >
            <app-image-card [item]="card"></app-image-card>
          </div>
        </a>
      </div>
    </div>
    <div class="flex h-full m-auto" [ngClass]="hiddenSideScrollClasses">
      <app-button
        id="btn-scroll-right"
        (click)="scrollRight()"
        fillColor="lemon"
        icon="rightArrow"
      ></app-button>
    </div>
  </div>
</div>
