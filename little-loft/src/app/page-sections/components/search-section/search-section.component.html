<div
  id="searchSubMenu"
  class="lg:absolute lg:-left-8 top-full z-10 mt-3 lg:w-screen max-w-md overflow-hidden rounded-3xl lg:bg-white lg:shadow-lg lg:ring-1 lg:ring-gray-900/5"
>
  <div class="p-4">
    <label for="search" class="hidden">Search</label>
    <div class="my-2">
      <div
        class="flex items-center rounded-full bg-white pl-3 outline outline-1 -outline-offset-1 outline-gray-300 focus-within:outline focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-primary"
      >
        <input
          type="text"
          name="search"
          id="search"
          class="block w-full grow py-1.5 pl-1 pr-3 text-base text-black placeholder:text-gray-300 focus:outline focus:outline-0 sm:text-sm/6"
          placeholder="Search"
        />
      </div>
    </div>
    <div class="grid grid-cols-2 divide-x divide-gray-900/5">
      <a
        href="#"
        class="flex items-center justify-center gap-x-2.5 p-5 text-sm/6 font-semibold text-primary hover:bg-gray-100"
      >
        <app-icon icon="bear" color="primary" [size]="15"></app-icon>

        Products
      </a>
      <a
        href="#"
        class="flex items-center justify-center gap-x-2.5 p-3 text-sm/6 font-semibold text-gray-900 hover:bg-gray-100"
      >
        <app-icon icon="smile"></app-icon>

        Sellers
      </a>
    </div>
    <div class="border-t border-gray-900/5"></div>
    <app-options-list [options]="searchCategories"></app-options-list>
  </div>
</div>
