<div *ngIf="!!item" class="min-w-[70px] max-w-[70px] md:max-w-20 justify-self-center">
  <img
    [src]="item.imageSrc"
    [alt]="item.alt"
    class="w-[50px] h-[50px] md:w-16 md:h-16 object-cover rounded-full justify-self-center"
  />
  <div class="text-center pt-2.5 justify-self-center">
    <h3
      class="text-xs/[14px] font-bold text-gray-900 overflow-hidden text-ellipsis line-clamp-3"
    >
      {{ item.title }}
    </h3>
  </div>
</div>
