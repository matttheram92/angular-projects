<div class="h-screen relative isolate mx-auto max-w-2xl lg:max-w-7xl">
  <ng-container *ngFor="let injector of injectors">
    <ng-container
      [ngComponentOutlet]="injector.currentComponentType"
      [ngComponentOutletInjector]="injector.currentInjector"
    ></ng-container>
  </ng-container>
  <div id="footer" class="flex h-56 pb-16 sm:pb-0 bg-primary">
    <p class="m-auto">footer will be here</p>
  </div>
</div>
