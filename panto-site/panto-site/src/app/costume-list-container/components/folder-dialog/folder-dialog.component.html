<div class="p-4">
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white">
        Move to folder
    </h2>
    <button
        (click)="close()"
        class="absolute top-0 right-0 text-sm leading-6 font-medium py-1 px-3 hover:bg-slate-100 rounded-full"
    >
        X
    </button>
    <p class="text-sm mb-5 text-gray-500">{{ data.costume.description }}</p>
    <app-dynamic-form
        class="w-full pb-4"
        [questions]="questions"
        [costumeToEdit]="data.costume"
        formType="folder"
    ></app-dynamic-form>
</div>
